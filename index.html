<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Mobile Intercom</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 5vw;
        }

        .phone-container {
            background-color: #1e293b;
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 6vw;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        @media (min-width: 480px) {
            .phone-container { padding: 30px; }
        }

        h2 {
            font-size: calc(1.6rem + 1vw);
            margin-bottom: 5px;
            color: #38bdf8;
        }

        .subtitle {
            font-size: calc(0.8rem + 0.2vw);
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .section {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: #f1f5f9;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 1.6rem;
            border-radius: 12px;
            border: 2px solid #334155;
            background-color: #1e293b;
            color: #fff;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus { border-color: #38bdf8; }

        button {
            width: 100%;
            padding: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active { transform: scale(0.97); }

        .btn-primary { background-color: #38bdf8; color: #0f172a; }
        .btn-primary:hover { background-color: #7dd3fc; }
        
        .btn-success { background-color: #22c55e; color: white; }
        .btn-success:hover { background-color: #4ade80; }
        
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #f87171; }

        .status-text {
            font-size: 1rem;
            margin-top: 10px;
            color: #e2e8f0;
            font-weight: 500;
        }

        /* Responsive Pop-up Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            border: 2px solid #38bdf8;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .modal-buttons button { margin-bottom: 0; }
    </style>
</head>
<body>

    <div class="phone-container">
        <h2>P2P Intercom</h2>
        <div class="subtitle">Global Device-to-Device Dialer</div>

        <div class="section">
            <h3>Your Extension</h3>
            <input type="text" id="my-code" placeholder="0000" maxlength="4" inputmode="numeric" pattern="[0-9]*">
            <button class="btn-primary" onclick="initGlobalDevice()">Register Device</button>
            <div id="status" class="status-text">Status: Offline</div>
        </div>

        <div class="section">
            <h3>Make a Call</h3>
            <input type="text" id="dial-code" placeholder="0000" maxlength="4" inputmode="numeric" pattern="[0-9]*">
            <button class="btn-success" onclick="startGlobalCall()">Dial</button>
            <button class="btn-danger" onclick="endCall()">Hang Up</button>
        </div>
    </div>

    <div id="incoming-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 style="color: #94a3b8;">Incoming Call From...</h3>
            <p id="caller-id-text" style="font-size: 2.5rem; font-weight: bold; margin: 15px 0; color: #38bdf8;">0000</p>
            <div class="modal-buttons">
                <button class="btn-success" onclick="acceptIncomingCall()">Accept</button>
                <button class="btn-danger" onclick="declineIncomingCall()">Decline</button>
            </div>
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <script>
        let peer;
        let currentCall;
        let pendingCallObject = null;
        let localStreamInstance = null;
        let activeNotification = null;

        // Web Audio Context variables
        let audioCtx = null;
        let ringInterval = null;

        const statusDisplay = document.getElementById('status');
        const incomingModal = document.getElementById('incoming-modal');
        const callerIdText = document.getElementById('caller-id-text');
        const remoteAudioOutput = document.getElementById('remote-audio');

        // Cordova / Capacitor Background Mode Wrapper integration
        document.addEventListener('deviceready', () => {
            if (window.cordova && window.cordova.plugins && window.cordova.plugins.backgroundMode) {
                window.cordova.plugins.backgroundMode.enable();
                window.cordova.plugins.backgroundMode.setDefaults({
                    title: "Intercom App Online",
                    text: "Listening for 4-digit incoming connections...",
                    icon: "icon",
                    color: "38bdf8"
                });
            }
        }, false);

        // Code-generated Ringtone Synthesizer
        function startAlertRingtone() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            function playSingleRingPattern() {
                if (!audioCtx || audioCtx.state === 'suspended') return;

                let osc1 = audioCtx.createOscillator();
                let osc2 = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();

                osc1.type = 'sine';
                osc2.type = 'square';
                
                osc1.frequency.value = 850;
                osc2.frequency.value = 440;

                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.15, now + 0.05);
                gainNode.gain.setValueAtTime(0.15, now + 0.3);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.35);

                gainNode.gain.setValueAtTime(0, now + 0.5);
                gainNode.gain.linearRampToValueAtTime(0.15, now + 0.55);
                gainNode.gain.setValueAtTime(0.15, now + 0.85);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.9);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 1.2);
                osc2.stop(now + 1.2);
            }

            playSingleRingPattern();
            ringInterval = setInterval(playSingleRingPattern, 2500);
        }

        function stopRingtoneAndUI() {
            if (ringInterval) {
                clearInterval(ringInterval);
                ringInterval = null;
            }
            if (activeNotification) {
                activeNotification.close();
                activeNotification = null;
            }
            incomingModal.style.display = 'none';
        }

        function sendSystemNotification(callerId) {
            if ("Notification" in window && Notification.permission === 'granted') {
                activeNotification = new Notification("📞 Incoming Intercom Call", {
                    body: `Extension ${callerId} is calling you...`,
                    tag: 'incoming-call',
                    requireInteraction: true
                });

                activeNotification.onclick = function() {
                    window.focus();
                    this.close();
                };
            }
        }

        async function getCachedMicrophoneStream() {
            if (localStreamInstance) return localStreamInstance; 
            try {
                localStreamInstance = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                localStorage.setItem('mic_granted', 'true');
                return localStreamInstance;
            } catch (err) {
                alert("Microphone access is required.");
                console.error(err);
                throw err;
            }
        }

        // Auto-request mic stream on page load if permission history is saved
        window.addEventListener('load', () => {
            if (localStorage.getItem('mic_granted') === 'true') {
                getCachedMicrophoneStream().catch(() => console.log("Awaiting first user touch interaction..."));
            }
        });

        function initGlobalDevice() {
            const myCode = document.getElementById('my-code').value.trim();
            if (myCode.length !== 4 || isNaN(myCode)) {
                alert("Please enter a valid 4-digit numeric code.");
                return;
            }

            if ("Notification" in window) {
                Notification.requestPermission();
            }

            peer = new Peer(myCode);

            peer.on('open', (id) => {
                statusDisplay.innerText = `🟢 Registered as ${id}`;
                statusDisplay.style.color = "#22c55e";
            });

            peer.on('call', (incomingCall) => {
                pendingCallObject = incomingCall;
                callerIdText.innerText = incomingCall.peer;
                incomingModal.style.display = 'flex';
                
                startAlertRingtone();
                sendSystemNotification(incomingCall.peer);

                // Auto shut down ring mechanics if the caller drops out early
                incomingCall.on('close', () => {
                    stopRingtoneAndUI();
                    resetCallStatus();
                });
            });

            peer.on('error', (err) => {
                statusDisplay.innerText = "❌ Registration Error";
                statusDisplay.style.color = "#ef4444";
                alert("Registration failed. That code may currently be in use elsewhere.");
            });
        }

        async function acceptIncomingCall() {
            if (!pendingCallObject) return;
            try {
                stopRingtoneAndUI();
                const stream = await getCachedMicrophoneStream();
                pendingCallObject.answer(stream);
                currentCall = pendingCallObject;
                
                statusDisplay.innerText = `📞 In Call with ${currentCall.peer}`;
                statusDisplay.style.color = "#38bdf8";

                currentCall.on('stream', (remoteStream) => {
                    remoteAudioOutput.srcObject = remoteStream;
                });

                currentCall.on('close', () => resetCallStatus());
            } catch (err) {
                declineIncomingCall();
            }
        }

        function declineIncomingCall() {
            if (pendingCallObject) {
                pendingCallObject.close();
                pendingCallObject = null;
            }
            stopRingtoneAndUI();
        }

        async function startGlobalCall() {
            const targetCode = document.getElementById('dial-code').value.trim();
            if (targetCode.length !== 4 || isNaN(targetCode)) {
                alert("Enter a valid 4-digit target code.");
                return;
            }
            if (!peer) {
                alert("Please register your device extension code first.");
                return;
            }

            try {
                statusDisplay.innerText = `⚡ Connecting to ${targetCode}...`;
                const stream = await getCachedMicrophoneStream();
                
                currentCall = peer.call(targetCode, stream);
                
                currentCall.on('stream', (remoteStream) => {
                    statusDisplay.innerText = `📞 Connected to ${targetCode}`;
                    statusDisplay.style.color = "#22c55e";
                    remoteAudioOutput.srcObject = remoteStream;
                });

                currentCall.on('close', () => resetCallStatus());
            } catch (err) {
                resetCallStatus();
            }
        }

        function endCall() {
            if (currentCall) currentCall.close();
            resetCallStatus();
        }

        function resetCallStatus() {
            if (peer) {
                statusDisplay.innerText = `🟢 Registered as ${peer.id}`;
                statusDisplay.style.color = "#22c55e";
            } else {
                statusDisplay.innerText = "Status: Offline";
                statusDisplay.style.color = "#e2e8f0";
            }
            remoteAudioOutput.srcObject = null;
            stopRingtoneAndUI();
        }
    </script>
</body>
</html>
