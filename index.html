<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4-Digit Secure Comm Link</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1c1c1e;
            --surface-hover: #2c2c2e;
            --primary-color: #4cd964;
            --text-color: #ffffff;
            --text-secondary: #8e8e93;
            --danger-color: #ff3b30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            align-items: center;
            justify-content: center;
        }

        /* Fluid Wrapper: Adapts instantly to regular mobile view or Desktop mode zoom scales */
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            max-width: 440px; 
            max-height: 850px;
            background-color: var(--bg-color);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .screen {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 70px; /* Leaves space for navbar */
        }

        .screen.active {
            display: flex;
        }

        /* Bottom Navigation Bar */
        nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: var(--surface-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #2c2c2c;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            flex: 1;
            padding: 10px 0;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        /* --- DIALPAD SCREEN --- */
        .identity-banner {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .display-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80px;
        }

        #dial-display {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text-secondary);
        }

        #dial-display.has-input {
            color: var(--text-color);
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            padding-bottom: 10px;
        }

        .key-btn {
            aspect-ratio: 1;
            background-color: var(--surface-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .key-btn:active {
            background-color: var(--surface-hover);
        }

        .key-btn.call {
            background-color: var(--primary-color);
            color: white;
            font-size: 15px;
            font-weight: bold;
        }

        .key-btn.transparent {
            background-color: transparent;
            font-size: 22px;
            color: var(--text-secondary);
        }

        .key-btn.sim {
            background-color: transparent;
            font-size: 11px;
            color: #0a84ff;
            font-weight: bold;
        }

        /* --- CONTACTS / HISTORY --- */
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 { font-size: 24px; font-weight: 700; }

        .add-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-item {
            background-color: var(--surface-color);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .item-name { font-weight: 600; font-size: 16px; }
        .item-code { color: var(--primary-color); font-weight: bold; font-family: monospace; }
        .status-missed { color: var(--danger-color); font-size: 12px; }
        .status-connected { color: var(--text-secondary); font-size: 12px; }

        /* --- SETTINGS SCREEN --- */
        .settings-group {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-row {
            background-color: var(--surface-color);
            padding: 14px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-row input {
            margin-right: 12px;
            accent-color: var(--primary-color);
        }

        /* --- CALL OVERLAY --- */
        #call-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 18, 18, 0.98);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 20px;
        }

        .call-status {
            color: var(--primary-color);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-align: center;
        }

        .call-target { font-size: 32px; font-weight: bold; text-align: center; }
        .call-subtarget { color: var(--text-secondary); margin-top: 6px; text-align: center; }

        .call-actions-row {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
        }

        .circle-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .bg-danger { background-color: var(--danger-color); }
        .bg-success { background-color: var(--primary-color); }

        /* --- MODAL DIALOG --- */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--surface-color);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-content input {
            background-color: #121212;
            border: 1px solid #3a3a3c;
            color: white;
            padding: 12px;
            border-radius: 8px;
            outline: none;
        }

        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
        .modal-btn { background: transparent; border: none; color: var(--text-secondary); font-size: 16px; cursor: pointer; }
        .modal-btn.confirm { color: var(--primary-color); }
    </style>
</head>
<body>

    <div id="app-container">
        
        <div id="screen-dialpad" class="screen active">
            <div class="identity-banner">My Permanent Code: <span id="my-hardware-id">----</span></div>
            <div class="display-container">
                <div id="dial-display">Enter Code</div>
            </div>
            <div class="keypad-grid">
                <div class="key-btn" onclick="pressKey('1')">1</div>
                <div class="key-btn" onclick="pressKey('2')">2</div>
                <div class="key-btn" onclick="pressKey('3')">3</div>
                <div class="key-btn" onclick="pressKey('4')">4</div>
                <div class="key-btn" onclick="pressKey('5')">5</div>
                <div class="key-btn" onclick="pressKey('6')">6</div>
                <div class="key-btn" onclick="pressKey('7')">7</div>
                <div class="key-btn" onclick="pressKey('8')">8</div>
                <div class="key-btn" onclick="pressKey('9')">9</div>
                <div class="key-btn" onclick="pressKey('*')">*</div>
                <div class="key-btn" onclick="pressKey('0')">0</div>
                <div class="key-btn" onclick="pressKey('#')">#</div>
                <div class="key-btn transparent" onclick="clearKey()">⌫</div>
                <div class="key-btn call" onclick="makeCall()">CALL</div>
                <div class="key-btn sim" onclick="simulateIncomingCall()">SIM IN</div>
            </div>
        </div>

        <div id="screen-contacts" class="screen">
            <div class="header-row">
                <h2>Contacts</h2>
                <button class="add-btn" onclick="openContactModal()">Add Contact</button>
            </div>
            <div id="contacts-list" class="list-container"></div>
        </div>

        <div id="screen-history" class="screen">
            <div class="header-row"><h2>Call History</h2></div>
            <div id="history-list" class="list-container"></div>
        </div>

        <div id="screen-settings" class="screen">
            <div class="header-row"><h2>Ringtones</h2></div>
            <div class="settings-group" id="ringtone-options"></div>
        </div>

        <nav>
            <div class="nav-item active" onclick="switchTab(0, 'dialpad')">
                <div class="nav-icon">⌨</div><div>Keypad</div>
            </div>
            <div class="nav-item" onclick="switchTab(1, 'contacts')">
                <div class="nav-icon">👤</div><div>Contacts</div>
            </div>
            <div class="nav-item" onclick="switchTab(2, 'history')">
                <div class="nav-icon">🕒</div><div>History</div>
            </div>
            <div class="nav-item" onclick="switchTab(3, 'settings')">
                <div class="nav-icon">⚙</div><div>Settings</div>
            </div>
        </nav>

        <div id="call-overlay">
            <div></div>
            <div>
                <div class="call-status" id="call-status-label">Calling...</div>
                <div class="call-target" id="call-target-label">0000</div>
                <div class="call-subtarget" id="call-subtarget-label">Code: 0000</div>
            </div>
            <div class="call-actions-row">
                <div id="btn-decline" class="circle-btn bg-danger" onclick="endCall()">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" transform="rotate(135 12 12)"/></svg>
                </div>
                <div id="btn-accept" class="circle-btn bg-success" onclick="acceptCall()">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M20 15.5c-1.25 0-2.45-.2-3.57-.57-.35-.11-.74-.03-1.02.24l-2.2 2.2c-2.83-1.44-5.14-3.76-6.56-6.58l2.2-2.21c.28-.27.36-.66.25-1.01C8.7 6.45 8.5 5.25 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <div id="contact-modal" class="modal">
        <div class="modal-content">
            <h3>Add Contact</h3>
            <input type="text" id="contact-name" placeholder="Contact Name">
            <input type="text" id="contact-code" placeholder="4-Digit Code" maxlength="4">
            <div class="modal-actions">
                <button class="modal-btn" onclick="closeContactModal()">Cancel</button>
                <button class="modal-btn confirm" onclick="saveContact()">Save</button>
            </div>
        </div>
    </div>

    <script>
        // --- MULTI-DEVICE SIGNALING SETUP ---
        // Connects to a public sandbox broker to allow actual real-time messaging between devices
        let ws;
        function connectSignalingChannel() {
            ws = new WebSocket('wss://echo.websocket.org'); // Swap with your private server IP if working offline
            
            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    // Filter messages meant explicitly for our structural ID
                    if (data.to === permanentUserCode && data.type === "INCOMING_HANDSHAKE") {
                        executeCallSetup(data.from, true);
                    } else if (data.to === permanentUserCode && data.type === "HANGUP_TRIGGER") {
                        remoteHangupReceived();
                    }
                } catch(e) {}
            };

            ws.onclose = () => setTimeout(connectSignalingChannel, 3000); // Auto-reconnect safety
        }

        function transmitSignal(target, typePayload) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ from: permanentUserCode, to: target, type: typePayload }));
            }
        }

        // --- 10 PREMIUM NAMED OSCILLATOR RINGTONES ---
        const RINGTONE_PROFILES = [
            { name: "Digital Horizon (Synth)", freq: 850, mod: 12 },
            { name: "Stratosphere Echo", freq: 1100, mod: 6 },
            { name: "Quantum Pulse Alert", freq: 620, mod: 22 },
            { name: "Corporate Matrix Chime", freq: 950, mod: 4 },
            { name: "Neon Cascade Wave", freq: 1300, mod: 15 },
            { name: "Sub-Orbital Ping", freq: 430, mod: 28 },
            { name: "Egress Terminal", freq: 740, mod: 10 },
            { name: "Crypto Vector Warning", freq: 500, mod: 20 },
            { name: "Hydra Resonance", freq: 1020, mod: 8 },
            { name: "Apex Alert Beacon", freq: 1180, mod: 30 }
        ];

        const AudioEngine = {
            ctx: null, osc1: null, osc2: null, gain: null, interval: null,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            startOutgoingBuzz() {
                this.init(); this.stop();
                const playTone = () => {
                    this.osc1 = this.ctx.createOscillator(); this.osc2 = this.ctx.createOscillator(); this.gain = this.ctx.createGain();
                    this.osc1.frequency.value = 440; this.osc2.frequency.value = 480;
                    this.osc1.connect(this.gain); this.osc2.connect(this.gain); this.gain.connect(this.ctx.destination);
                    this.gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    this.osc1.start(); this.osc2.start();
                    setTimeout(() => this.stopTonesOnly(), 2000);
                };
                playTone(); this.interval = setInterval(playTone, 6000);
            },
            startIncomingAlert(profileIndex) {
                this.init(); this.stop();
                const profile = RINGTONE_PROFILES[profileIndex] || RINGTONE_PROFILES[0];
                const playAlert = () => {
                    this.osc1 = this.ctx.createOscillator(); this.gain = this.ctx.createGain();
                    this.osc1.type = 'triangle';
                    this.osc1.frequency.setValueAtTime(profile.freq, this.ctx.currentTime);
                    this.osc1.frequency.linearRampToValueAtTime(profile.freq + (profile.mod * 12), this.ctx.currentTime + 1.4);
                    this.osc1.connect(this.gain); this.gain.connect(this.ctx.destination);
                    this.gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    this.gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 1.6);
                    this.osc1.start();
                    setTimeout(() => this.stopTonesOnly(), 1600);
                };
                playAlert(); this.interval = setInterval(playAlert, 2500);
            },
            stopTonesOnly() {
                if (this.osc1) { try { this.osc1.stop(); } catch(e){} }
                if (this.osc2) { try { this.osc2.stop(); } catch(e){} }
                this.osc1 = null; this.osc2 = null;
            },
            stop() { clearInterval(this.interval); this.stopTonesOnly(); }
        };

        // --- STATE & STORAGE ---
        let currentInput = "";
        let permanentUserCode = "";
        let activeCallContext = null;
        let callTimeoutTimer = null;
        const RINGER_LIMIT = 10000; // Strict 10-second rule

        let contacts = JSON.parse(localStorage.getItem("app_contacts")) || [];
        let callHistory = JSON.parse(localStorage.getItem("app_history")) || [];
        let selectedRingtone = parseInt(localStorage.getItem("app_ringtone")) || 0;

        function initIdentity() {
            let hardwareId = localStorage.getItem("app_hardware_uuid");
            if (!hardwareId) {
                hardwareId = Math.floor(1000 + Math.random() * 9000).toString();
                localStorage.setItem("app_hardware_uuid", hardwareId);
            }
            permanentUserCode = hardwareId;
            document.getElementById("my-hardware-id").innerText = permanentUserCode;

            if ("Notification" in window && Notification.permission === "default") {
                Notification.requestPermission();
            }
            connectSignalingChannel();
        }

        function switchTab(index, screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(`screen-${screenId}`).classList.add('active');
            document.querySelectorAll('.nav-item')[index].classList.add('active');
            if(screenId === 'contacts') renderContacts();
            if(screenId === 'history') renderHistory();
        }

        function pressKey(num) { if (currentInput.length < 4) { currentInput += num; updateDisplay(); } }
        function clearKey() { currentInput = currentInput.slice(0, -1); updateDisplay(); }
        function updateDisplay() {
            const display = document.getElementById("dial-display");
            if (currentInput.length === 0) {
                display.innerText = "Enter Code"; display.classList.remove("has-input");
            } else {
                display.innerText = currentInput; display.classList.add("has-input");
            }
        }

        // --- CALL SYSTEM ---
        function makeCall() {
            if (currentInput.length < 4) return;
            transmitSignal(currentInput, "INCOMING_HANDSHAKE");
            executeCallSetup(currentInput, false);
        }

        function executeCallSetup(targetCode, isIncoming = false) {
            if (callTimeoutTimer) clearTimeout(callTimeoutTimer);
            const targetContact = contacts.find(c => c.code === targetCode);
            const displayName = targetContact ? targetContact.name : "Unknown Terminal Node";

            activeCallContext = { name: displayName, code: targetCode, isIncoming: isIncoming };

            document.getElementById("call-target-label").innerText = displayName;
            document.getElementById("call-subtarget-label").innerText = `Code: ${targetCode}`;
            
            document.getElementById("call-overlay").style.display = "flex";
            const btnAccept = document.getElementById("btn-accept");

            if (isIncoming) {
                document.getElementById("call-status-label").innerText = "Incoming Call...";
                btnAccept.style.display = "flex";
                AudioEngine.startIncomingAlert(selectedRingtone);

                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("Secure Line Alert", {
                        body: `Incoming communication link request from: ${targetCode}`,
                        requireInteraction: true
                    });
                }

                // THE 10-SECOND DISCONNECT RULE
                callTimeoutTimer = setTimeout(() => { handleCallMissedTimeout(); }, RINGER_LIMIT);
            } else {
                document.getElementById("call-status-label").innerText = "Calling...";
                btnAccept.style.display = "none";
                AudioEngine.startOutgoingBuzz();
                logCallEvent(displayName, targetCode, false, true);
            }
        }

        function acceptCall() {
            if (callTimeoutTimer) clearTimeout(callTimeoutTimer);
            AudioEngine.stop();
            document.getElementById("call-status-label").innerText = "Connected";
            document.getElementById("btn-accept").style.display = "none";
            if (activeCallContext) logCallEvent(activeCallContext.name, activeCallContext.code, true, true);
        }

        function endCall() {
            if (callTimeoutTimer) clearTimeout(callTimeoutTimer);
            AudioEngine.stop();
            if (activeCallContext) {
                transmitSignal(activeCallContext.code, "HANGUP_TRIGGER");
                if (activeCallContext.isIncoming && document.getElementById("call-status-label").innerText === "Incoming Call...") {
                    logCallEvent(activeCallContext.name, activeCallContext.code, true, false);
                }
            }
            document.getElementById("call-overlay").style.display = "none";
            activeCallContext = null; currentInput = ""; updateDisplay();
        }

        function remoteHangupReceived() {
            if (callTimeoutTimer) clearTimeout(callTimeoutTimer);
            AudioEngine.stop();
            document.getElementById("call-overlay").style.display = "none";
            activeCallContext = null; currentInput = ""; updateDisplay();
        }

        function handleCallMissedTimeout() {
            AudioEngine.stop();
            document.getElementById("call-overlay").style.display = "none";
            if (activeCallContext) {
                transmitSignal(activeCallContext.code, "HANGUP_TRIGGER");
                logCallEvent(activeCallContext.name, activeCallContext.code, true, false);
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("Missed Request Connection", { body: `Auto-terminated line from channel: ${activeCallContext.code}` });
                }
            }
            activeCallContext = null; currentInput = ""; updateDisplay();
        }

        function simulateIncomingCall() {
            const fakeCodes = ["5512", "9941", "3024"];
            executeCallSetup(fakeCodes[Math.floor(Math.random() * fakeCodes.length)], true);
        }

        function logCallEvent(name, code, isIncoming, wasAnswered) {
            callHistory.unshift({
                name: name === "Unknown Terminal Node" ? null : name,
                code: code,
                timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                isIncoming: isIncoming,
                wasAnswered: wasAnswered
            });
            localStorage.setItem("app_history", JSON.stringify(callHistory));
        }

        // --- CONTACT MANAGEMENT ---
        function openContactModal() { document.getElementById("contact-modal").style.display = "flex"; }
        function closeContactModal() { document.getElementById("contact-modal").style.display = "none"; }
        function saveContact() {
            const name = document.getElementById("contact-name").value.trim();
            const code = document.getElementById("contact-code").value.trim();
            if (name && code.length === 4) {
                contacts.push({ name, code });
                localStorage.setItem("app_contacts", JSON.stringify(contacts));
                renderContacts(); closeContactModal();
                document.getElementById("contact-name").value = ""; document.getElementById("contact-code").value = "";
            }
        }

        function renderContacts() {
            const container = document.getElementById("contacts-list");
            container.innerHTML = contacts.length === 0 ? '<div style="color:var(--text-secondary); text-align:center; padding-top:40px;">No saved connections</div>' : '';
            contacts.forEach(c => {
                container.innerHTML += `<div class="list-item" onclick="currentInput='${c.code}'; updateDisplay(); executeCallSetup('${c.code}', false)">
                    <div class="item-name">${c.name}</div><div class="item-code">${c.code}</div>
                </div>`;
            });
        }

        function renderHistory() {
            const container = document.getElementById("history-list");
            container.innerHTML = callHistory.length === 0 ? '<div style="color:var(--text-secondary); text-align:center; padding-top:40px;">No recent records</div>' : '';
            callHistory.forEach(h => {
                let stateLabel = h.isIncoming ? (h.wasAnswered ? '<span class="status-connected">Incoming</span>' : '<span class="status-missed">Missed</span>') : '<span class="status-connected">Outgoing</span>';
                container.innerHTML += `<div class="list-item">
                    <div><div class="item-name">${h.name || 'Unknown Terminal'}</div><div style="font-size:12px;margin-top:4px;">${stateLabel} • ID: ${h.code}</div></div>
                    <div style="color:var(--text-secondary);font-size:14px;">${h.timestamp}</div>
                </div>`;
            });
        }

        function initSettings() {
            const container = document.getElementById("ringtone-options");
            RINGTONE_PROFILES.forEach((prof, i) => {
                container.innerHTML += `<label class="radio-row">
                    <input type="radio" name="ringtone" value="${i}" ${selectedRingtone === i ? 'checked' : ''}>
                    <span>${prof.name}</span>
                </label>`;
            });
            container.addEventListener('change', (e) => {
                if (e.target.name === 'ringtone') {
                    selectedRingtone = parseInt(e.target.value);
                    localStorage.setItem("app_ringtone", selectedRingtone);
                    AudioEngine.startIncomingAlert(selectedRingtone); setTimeout(() => AudioEngine.stop(), 2000);
                }
            });
        }

        window.onload = () => { initIdentity(); initSettings(); };
    </script>
</body>
</html>
